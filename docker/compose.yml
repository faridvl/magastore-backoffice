# Entorno local de Magastore: Postgres + proxy compatible con el driver de Neon.
# Los puertos se publican solo en 127.0.0.1 y las credenciales (postgres/postgres)
# son triviales a propósito: nada de esto es alcanzable desde otra máquina.
# `name` fijo para que el volumen sea el mismo desde cualquier carpeta o worktree; los scripts
# además pasan `-p magastore-local`, porque COMPOSE_PROJECT_NAME del entorno le gana a `name`.
name: magastore-local

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: magastore
      TZ: UTC
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d magastore']
      interval: 3s
      timeout: 5s
      retries: 20

  # Traduce el protocolo HTTP y WebSocket del driver de Neon a Postgres normal.
  # La app usa neon() (HTTP en /sql) y migrate.mjs usa Pool (WebSocket en /v1).
  # Pendiente: solo publica el tag `main`; tras el primer pull fijarlo por digest (`@sha256:...`).
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@db:5432/magastore
    ports:
      - '127.0.0.1:4444:4444'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
