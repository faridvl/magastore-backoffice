<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Magastore">
  <!--
    Favicon vectorizado a mano a partir del logo. No es una traza del arte
    original: a 16px el isotipo completo (globo + dos cajas + dos flechas) se
    empasta, así que se conserva solo la firma reconocible — el globo dentro
    del ciclo de flechas — con trazos lo bastante gruesos para leerse en chico.
  -->
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d67a" />
      <stop offset=".45" stop-color="#e6ab00" />
      <stop offset="1" stop-color="#b8860b" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="#111111" />

  <!-- Flechas de ciclo -->
  <g fill="none" stroke="url(#oro)" stroke-width="4" stroke-linecap="round">
    <path d="M16 24a18 18 0 0 1 28-4" />
    <path d="M48 40a18 18 0 0 1-28 4" />
  </g>
  <g fill="url(#oro)">
    <path d="M44 12l7 8-11 2z" />
    <path d="M20 52l-7-8 11-2z" />
  </g>

  <!-- Globo -->
  <g fill="none" stroke="url(#oro)" stroke-width="3">
    <circle cx="32" cy="32" r="11" />
    <ellipse cx="32" cy="32" rx="4.6" ry="11" />
    <path d="M21 32h22" stroke-linecap="round" />
  </g>
</svg>
