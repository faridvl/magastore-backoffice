name: Migraciones del PR

# Avisa qué migraciones trae un PR hacia main. Es informativo: solo falla si el PR toca una
# migración ya existente en main, si la numeración de las nuevas no es seguida o si hay nombres
# inválidos.
#
# Seguridad: usa pull_request (corre la versión del PR, así que funciona en el PR que lo introduce).
# En PRs de forks GitHub entrega un token de solo lectura y sin secretos, por eso ahí solo se escribe
# el resumen del job y se omite el comentario. En PRs del mismo repo el código es de una rama propia.
# Sin secretos ni environment: solo GITHUB_TOKEN. La lista de main sale de la API (commit base), no
# del checkout, y los nombres del PR nunca se imprimen si no cumplen el patrón estricto.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: migraciones-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migraciones:
    name: migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Revisar migraciones del PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const modulePath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/migraciones-pr.mjs`;
            const { analyzeMigrations, buildMessage, planComment, COMMENT_MARKER } = await import(
              pathToFileURL(modulePath).href
            );

            const { owner, repo } = context.repo;
            const pullRequest = context.payload.pull_request;
            const issue_number = pullRequest.number;
            const isFork = pullRequest.head.repo.full_name !== `${owner}/${repo}`;

            // Lista de main desde la API en el commit base (no del checkout, que trae el PR).
            const { data: mainEntries } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'scripts',
              ref: pullRequest.base.sha,
            });
            const mainFiles = mainEntries.filter((entry) => entry.type === 'file').map((entry) => entry.name);

            const prFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });

            const analysis = analyzeMigrations(mainFiles, prFiles, {
              changedFiles: pullRequest.changed_files,
            });
            const message = buildMessage(analysis);

            await core.summary.addRaw(message, true).write();

            if (!isFork) {
              const body = `${COMMENT_MARKER}\n${message}`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find(
                (comment) =>
                  comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(COMMENT_MARKER),
              );
              const action = planComment({ analysis, existingBody: existing?.body, isFork });
              if (action === 'update' && existing.body !== body) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else if (action === 'create') {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

            if (analysis.hasErrors) {
              core.setFailed(analysis.errors.join('\n'));
            }
